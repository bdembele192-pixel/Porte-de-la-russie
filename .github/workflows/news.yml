name: Actualités des marchés

# Collecte les communiqués officiels (banques centrales, institutions, régulateurs, statistiques)
# et met à jour trading/data/news.json. L'app relit ce fichier toutes les 2 minutes.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Collecter les actualités
        run: node trading/scripts/fetch-news.mjs
      - name: Publier si nouveau
        run: |
          git config user.name "meche-news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trading/data/news.json
          if git diff --cached --quiet; then echo "Rien de nouveau"; exit 0; fi
          git commit -m "Actus : mise à jour automatique [skip ci]"
          for i in 1 2 3; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0; sleep 5; done
          exit 1
