name: Mèche OS

# Tests de la commande « marche » à chaque modification de os/,
# et construction de l'image ISO à la demande (onglet Actions → « Run workflow »)
# ou à la création d'une étiquette os-v* (publiée alors comme « Release »).
on:
  push:
    paths:
      - "os/**"
      - ".github/workflows/os.yml"
    tags:
      - "os-v*"
  pull_request:
    paths:
      - "os/**"
  workflow_dispatch:
    inputs:
      clavier:
        description: "Disposition du clavier (fr, us, be, ch…)"
        default: "fr"
      fuseau:
        description: "Fuseau horaire"
        default: "Africa/Abidjan"

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Tests de marche
        run: python3 -m unittest discover -s os/tests -v
      - name: Vérification des lanceurs
        run: |
          sudo apt-get install -y -q desktop-file-utils
          desktop-file-validate os/rootfs/usr/share/applications/*.desktop
      - name: Vérification des scripts shell
        run: |
          bash -n os/build.sh
          for f in os/rootfs/usr/local/bin/*; do
            head -1 "$f" | grep -q python || sh -n "$f"
          done

  iso:
    needs: tests
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/os-v')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Libérer de l'espace disque
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Outils de construction
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends debootstrap squashfs-tools xorriso \
            grub-pc-bin grub-efi-amd64-bin grub-common mtools dosfstools
      - name: Construire l'ISO
        env:
          KEYMAP: ${{ github.event.inputs.clavier || 'fr' }}
          TIMEZONE: ${{ github.event.inputs.fuseau || 'Africa/Abidjan' }}
        run: sudo -E ./os/build.sh
      - name: Publier l'ISO (artefact)
        uses: actions/upload-artifact@v4
        with:
          name: meche-os-iso
          path: |
            os/out/*.iso
            os/out/*.sha256
          compression-level: 0
          retention-days: 14
      - name: Publier une Release
        if: startsWith(github.ref, 'refs/tags/os-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            os/out/*.iso
            os/out/*.sha256
          body: |
            Image ISO de Mèche OS (base Ubuntu 24.04 LTS, BIOS + UEFI).
            Copiez-la sur une clé USB avec balenaEtcher, Rufus (mode DD) ou `dd`, puis démarrez dessus.
