set default=0
set timeout=8

insmod all_video
insmod gfxterm
insmod png
loadfont unicode
set gfxmode=auto
terminal_output gfxterm
if background_image /boot/grub/fond.png; then true; fi
set color_normal=light-gray/black
set color_highlight=white/magenta
set menu_color_normal=light-gray/black
set menu_color_highlight=white/magenta

search --no-floppy --set=root --file /meche-os

menuentry "Mèche OS @VERSION@ — démarrer (français, clavier @KEYMAP@)" {
    linux /casper/vmlinuz boot=casper locale=fr_FR.UTF-8 keyboard-configuration/layoutcode=@KEYMAP@ quiet splash ---
    initrd /casper/initrd
}
menuentry "Mèche OS — clavier QWERTY (us)" {
    linux /casper/vmlinuz boot=casper locale=fr_FR.UTF-8 keyboard-configuration/layoutcode=us quiet splash ---
    initrd /casper/initrd
}
menuentry "Mèche OS — mode sans échec graphique" {
    linux /casper/vmlinuz boot=casper locale=fr_FR.UTF-8 keyboard-configuration/layoutcode=@KEYMAP@ nomodeset ---
    initrd /casper/initrd
}
menuentry "Mèche OS — en mémoire vive (retirer la clé après démarrage)" {
    linux /casper/vmlinuz boot=casper toram locale=fr_FR.UTF-8 keyboard-configuration/layoutcode=@KEYMAP@ quiet splash ---
    initrd /casper/initrd
}
menuentry "Mèche OS — avec persistance (fichiers conservés sur la clé)" {
    linux /casper/vmlinuz boot=casper persistent locale=fr_FR.UTF-8 keyboard-configuration/layoutcode=@KEYMAP@ quiet splash ---
    initrd /casper/initrd
}
if [ "$grub_platform" = "efi" ]; then
menuentry "Paramètres du micrologiciel UEFI" {
    fwsetup
}
fi
menuentry "Redémarrer" {
    reboot
}
menuentry "Éteindre" {
    halt
}
